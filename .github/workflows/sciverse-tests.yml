name: Sciverse integration
on:
  push:
    paths: ['ResearchStudio-Idea/**', '.github/workflows/sciverse-tests.yml']
  pull_request:
    paths: ['ResearchStudio-Idea/**', '.github/workflows/sciverse-tests.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install requests
      - run: python -m unittest discover -s ResearchStudio-Idea/tests -p 'test_sciverse.py' -v
      - run: python ResearchStudio-Idea/skills/paper_search/scripts/selftest_postprocess.py
      - run: python ResearchStudio-Idea/skills/paper_search/scripts/selftest_runtime.py
